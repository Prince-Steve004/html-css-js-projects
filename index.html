<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
        }
        header {
            background: #35424a;
            color: #ffffff;
            padding: 10px 0;
            width: 100%;
            text-align: center;
        }
        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .project {
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 5px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s;
        }
        .project:hover {
            transform: scale(1.05);
        }
        .project img {
            max-width: 100%;
            height: auto;
        }
        .project a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #35424a;
            font-weight: bold;
            background: #e2e2e2;
            border: none;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
        <p>A collection of my projects</p>
    </header>
    <div class="portfolio">
        <!-- Project examples, duplicate for all 54 projects with relevant links -->
       <a href="html-css-js-projects/quiz-game">Quiz game</a>
</body>
</html>
