<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Homepage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: #fff; padding: 1em; text-align: center; }
        main { padding: 2em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .project { border: 1px solid #ddd; padding: 1em; border-radius: 5px; }
        footer { text-align: center; padding: 1em; background: #333; color: #fff; position: relative; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
        <p>A showcase of my projects</p>
    </header>
    <main>
        <div class="grid">
            <!-- Example project items -->
            <div class="project">
                <h2><a href="/path/to/project1">Project 1</a></h2>
                <p>Description for project 1.</p>
            </div>
            <div class="project">
                <h2><a href="/path/to/project2">Project 2</a></h2>
                <p>Description for project 2.</p>
            </div>
            <!-- Repeat similar structure for other projects -->
            <div class="project">
                <h2><a href="/path/to/project54">Project 54</a></h2>
                <p>Description for project 54.</p>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Prince Steve</p>
    </footer>
</body>
</html>
